[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personos"
version = "0.1.3"
description = "Multimodal long-term memory for robots, smart glasses and agents — video, images and conversations in; memory that knows who, out"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "PersonOS contributors" }]
keywords = ["memory", "llm", "agent", "rag", "multimodal", "long-term-memory", "video", "robotics", "identity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core stays small on purpose. Everything here is needed to write and read
# text memory against an OpenAI-compatible endpoint with local SQLite storage —
# nothing else. In particular there is no torch, no langchain, no web framework
# and no database driver beyond what SQLite gives us for free, because a memory
# library should not decide those things for the application embedding it.
dependencies = [
    "pydantic>=2.6",          # configuration schemas
    "httpx>=0.27",            # provider transport
    "numpy>=1.26",            # vector maths; retrieval is a scan plus cosine
    "SQLAlchemy>=2.0",        # storage engine (SQLite needs no driver)
    "loguru>=0.7",            # structured logging
    "python-ulid>=2.2",       # sortable ids
    "python-dotenv>=1.0",     # .env support
]

[project.optional-dependencies]
# Deep recall: a multi-step agent over the memory store. Recommended, but a
# large dependency, and the fast path answers most questions without it.
deep = ["langchain>=1.0", "langchain-classic>=1.0"]
mysql = ["PyMySQL>=1.1"]                 # several workers sharing one database
redis = ["redis>=5.0"]                   # several workers sharing session state
oss = ["oss2>=2.19"]                     # object storage instead of local files
image = ["pillow>=11.0"]                 # image handling helpers
anthropic = ["anthropic>=0.40"]          # Anthropic-protocol chat provider
observability = ["langfuse>=3,<4"]       # tracing; unset means every call is a no-op
# Video identity. Heavy and split fine-grained on purpose, so that nobody
# installing the text-only core pays for it.
video = ["av>=13.0", "soundfile>=0.12"]   # demux, frames, 16k audio
identity-face = [
    "insightface>=0.7",
    "onnxruntime>=1.17",
    "onnx>=1.13",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "tqdm>=4.66",
    "requests>=2.31",
]
# Voiceprints pull in torch. That is roughly 2 GB, which is why identity is
# split this finely: taking faces without voices is a reasonable choice.
identity-voice = ["speechbrain>=1.0", "torch>=2.0", "torchaudio>=2.0", "scipy>=1.11"]
identity = ["personos[video,identity-face,identity-voice]"]
all = ["personos[deep,mysql,redis,oss,image,anthropic,observability,identity]"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "pre-commit", "fastapi>=0.110",
       "uvicorn[standard]>=0.29", "PyMySQL>=1.1", "redis>=5.0", "pillow>=11.0",
       "langchain>=1.0", "langchain-classic>=1.0"]

[project.scripts]
personos = "personos.cli:main"

[project.urls]
Homepage = "https://github.com/2049lab/personos"
Issues = "https://github.com/2049lab/personos/issues"

[tool.hatch.build.targets.wheel]
# Only the library ships. `server/` is a sibling deployable with its own requirements.
packages = ["personos"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
