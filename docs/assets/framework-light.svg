<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="186" viewBox="0 0 1000 186" role="img" aria-labelledby="title desc">
<title id="title">The four layers of PersonOS memory</title>
<desc id="desc">Evidence preserves source records. Episodes keep personal context. Atoms support retrieval. Chains connect related observations over time.</desc>
<rect x="0.5" y="0.5" width="999" height="185" rx="14" fill="#fafaf9" stroke="#d8dde3"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="24" y="20" width="226" height="146" rx="8" fill="#ffffff" stroke="#d8dde3"/>
<text x="42" y="47" font-size="16" font-weight="600" fill="#356be2">01</text>
<text x="42" y="85" font-size="25" font-weight="600" fill="#182029">Evidence</text>
<text x="42" y="119" font-size="17" fill="#182029">Original words</text>
<text x="42" y="144" font-size="17" fill="#69727e">and media</text>
<rect x="266" y="20" width="226" height="146" rx="8" fill="#ffffff" stroke="#d8dde3"/>
<text x="284" y="47" font-size="16" font-weight="600" fill="#356be2">02</text>
<text x="284" y="85" font-size="25" font-weight="600" fill="#182029">Episodes</text>
<text x="284" y="119" font-size="17" fill="#182029">Personal events</text>
<text x="284" y="144" font-size="17" fill="#69727e">in context</text>
<rect x="508" y="20" width="226" height="146" rx="8" fill="#ffffff" stroke="#d8dde3"/>
<text x="526" y="47" font-size="16" font-weight="600" fill="#356be2">03</text>
<text x="526" y="85" font-size="25" font-weight="600" fill="#182029">Atoms</text>
<text x="526" y="119" font-size="17" fill="#182029">Facts for retrieval</text>
<text x="526" y="144" font-size="17" fill="#69727e">linked to episodes</text>
<rect x="750" y="20" width="226" height="146" rx="8" fill="#ffffff" stroke="#d8dde3"/>
<text x="768" y="47" font-size="16" font-weight="600" fill="#356be2">04</text>
<text x="768" y="85" font-size="25" font-weight="600" fill="#182029">Chains</text>
<text x="768" y="119" font-size="17" fill="#182029">Related records</text>
<text x="768" y="144" font-size="17" fill="#69727e">across time</text>
</g></svg>
