<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="186" viewBox="0 0 1000 186" role="img" aria-labelledby="title desc">
<title id="title">The four layers of PersonOS memory</title>
<desc id="desc">Evidence preserves source records. Episodes keep personal context. Atoms support retrieval. Chains connect related observations over time.</desc>
<rect x="0.5" y="0.5" width="999" height="185" rx="14" fill="#10141a" stroke="#303945"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="24" y="20" width="226" height="146" rx="8" fill="#171d26" stroke="#303945"/>
<text x="42" y="47" font-size="16" font-weight="600" fill="#84a8ff">01</text>
<text x="42" y="85" font-size="25" font-weight="600" fill="#e9edf2">Evidence</text>
<text x="42" y="119" font-size="17" fill="#e9edf2">Original words</text>
<text x="42" y="144" font-size="17" fill="#9da8b8">and media</text>
<rect x="266" y="20" width="226" height="146" rx="8" fill="#171d26" stroke="#303945"/>
<text x="284" y="47" font-size="16" font-weight="600" fill="#84a8ff">02</text>
<text x="284" y="85" font-size="25" font-weight="600" fill="#e9edf2">Episodes</text>
<text x="284" y="119" font-size="17" fill="#e9edf2">Personal events</text>
<text x="284" y="144" font-size="17" fill="#9da8b8">in context</text>
<rect x="508" y="20" width="226" height="146" rx="8" fill="#171d26" stroke="#303945"/>
<text x="526" y="47" font-size="16" font-weight="600" fill="#84a8ff">03</text>
<text x="526" y="85" font-size="25" font-weight="600" fill="#e9edf2">Atoms</text>
<text x="526" y="119" font-size="17" fill="#e9edf2">Facts for retrieval</text>
<text x="526" y="144" font-size="17" fill="#9da8b8">linked to episodes</text>
<rect x="750" y="20" width="226" height="146" rx="8" fill="#171d26" stroke="#303945"/>
<text x="768" y="47" font-size="16" font-weight="600" fill="#84a8ff">04</text>
<text x="768" y="85" font-size="25" font-weight="600" fill="#e9edf2">Chains</text>
<text x="768" y="119" font-size="17" fill="#e9edf2">Related records</text>
<text x="768" y="144" font-size="17" fill="#9da8b8">across time</text>
</g></svg>
