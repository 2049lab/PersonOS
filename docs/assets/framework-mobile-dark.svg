<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" role="img" aria-labelledby="title desc">
<title id="title">The four layers of PersonOS memory</title>
<desc id="desc">Evidence preserves source records. Episodes keep personal context. Atoms support retrieval. Chains connect related observations over time.</desc>
<rect x="0.5" y="0.5" width="439" height="369" rx="14" fill="#10141a" stroke="#303945"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<rect x="20" y="20" width="192" height="156" rx="8" fill="#171d26" stroke="#303945"/>
<text x="36" y="45" font-size="16" font-weight="600" fill="#84a8ff">01</text>
<text x="36" y="83" font-size="25" font-weight="600" fill="#e9edf2">Evidence</text>
<text x="36" y="118" font-size="18" fill="#e9edf2">Original words</text>
<text x="36" y="143" font-size="18" fill="#9da8b8">and media</text>
<rect x="228" y="20" width="192" height="156" rx="8" fill="#171d26" stroke="#303945"/>
<text x="244" y="45" font-size="16" font-weight="600" fill="#84a8ff">02</text>
<text x="244" y="83" font-size="25" font-weight="600" fill="#e9edf2">Episodes</text>
<text x="244" y="118" font-size="18" fill="#e9edf2">Personal events</text>
<text x="244" y="143" font-size="18" fill="#9da8b8">in context</text>
<rect x="20" y="194" width="192" height="156" rx="8" fill="#171d26" stroke="#303945"/>
<text x="36" y="219" font-size="16" font-weight="600" fill="#84a8ff">03</text>
<text x="36" y="257" font-size="25" font-weight="600" fill="#e9edf2">Atoms</text>
<text x="36" y="292" font-size="18" fill="#e9edf2">Facts for retrieval</text>
<text x="36" y="317" font-size="18" fill="#9da8b8">linked to episodes</text>
<rect x="228" y="194" width="192" height="156" rx="8" fill="#171d26" stroke="#303945"/>
<text x="244" y="219" font-size="16" font-weight="600" fill="#84a8ff">04</text>
<text x="244" y="257" font-size="25" font-weight="600" fill="#e9edf2">Chains</text>
<text x="244" y="292" font-size="18" fill="#e9edf2">Related records</text>
<text x="244" y="317" font-size="18" fill="#9da8b8">across time</text>
</g></svg>
